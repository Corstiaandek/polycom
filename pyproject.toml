[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cx300-bridge"
version = "0.1.0"
description = "Polycom CX300 multi-target bridge for Grok Bot and Claude Desktop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hidapi>=0.14.0",
  "sounddevice>=0.5.0",
  "numpy>=1.26",
  "pystray>=0.19",
  "Pillow>=10.0",
  "pynput>=1.7",
  "pywin32>=306; platform_system=='Windows'",
]

[project.scripts]
cx300-bridge = "cx300_bridge.app:main"
cx300-smoke = "cx300_bridge.smoke:main"
cx300-verify = "cx300_bridge.verify:main"

[tool.setuptools.packages.find]
where = ["src"]
